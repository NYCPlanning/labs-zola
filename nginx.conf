server {
    listen 80;
    server_name _;                  # any hostname

    root /usr/share/nginx/html;     # where you copied /app/dist

    #  gzip      on;                # (optional) enable gzip/Brotli etc.

    location / {
        # Serve the file if it exists, otherwise fall back to index.html
        try_files $uri $uri/ /index.html;
    }

    # Optional: cache‑control headers for static assets
    location ~* \.(js|css|png|jpg|svg|woff2?)$ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
